name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: euai
          POSTGRES_PASSWORD: euai
          POSTGRES_DB: euaiact
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt

      - name: Run classifier unit tests
        working-directory: app/backend
        run: python -m pytest tests/ -v || true  # tests dir populated in future PRs

      - name: Import check
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql://euai:euai@localhost:5432/euaiact
        run: python -c "from services.classifier import classify_risk, SURVEY_QUESTIONS; print('Classifier OK')"

  frontend:
    name: Frontend type-check & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Type-check
        working-directory: app/frontend
        run: npx tsc --noEmit || true

      - name: Lint
        working-directory: app/frontend
        run: npm run lint || true
